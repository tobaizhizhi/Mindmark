[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmark-ai-gateway"
version = "0.1.0"
description = "Private OpenAI-compatible model gateway for Mindmark"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mindmark-ai-gateway = "mindmark_ai_gateway.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
