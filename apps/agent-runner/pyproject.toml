[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmark-agent-runner"
version = "0.1.0"
description = "Private Python agent runtime for Mindmark workflows"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mindmark-agent-runner = "mindmark_agent_runner.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
